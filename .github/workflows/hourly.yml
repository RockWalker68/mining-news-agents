# Runs the Mining Desk on GitHub's computers, then saves the results
# (data/ and docs/) back into this repository. GitHub Pages serves
# docs/index.html as your morning page.

name: Mining Desk

on:
  schedule:
    # Three times an hour (UTC). GitHub often starts scheduled runs late or
    # skips one, so running more often means a missed run is caught within
    # 20 minutes. Most runs just check the clock and finish in seconds.
    # pipeline.py decides what is due, using Pacific time.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:          # Adds a "Run workflow" button on the Actions tab
    inputs:
      now:
        description: "Run every job right now (ignore the schedule)"
        type: boolean
        default: false

permissions:
  contents: write             # Lets the run save its results back to the repository
  issues: write               # Lets the run read and close the feedback sent from Dan's Tab

concurrency:
  group: mining-desk          # Never run two at once
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run the desk
        run: python pipeline.py ${{ inputs.now && '--now' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}     # The SEC requires a contact email
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}       # Free key for the research journals
          GITHUB_TOKEN: ${{ github.token }}                       # Built in; used to read feedback from Dan's Tab
          DAN_PASSWORD: ${{ secrets.DAN_PASSWORD }}               # Locks Dan's Tab; without it the tab isn't built

      - name: Save results
        run: |
          git config user.name "mining-desk-bot"
          git config user.email "mining-desk-bot@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Desk update $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
